syntax = "proto3";

// Enum fields for manual testing of the value list: Enter on a value opens it
enum Color {
  RED = 0;
  GREEN = 1;
  BLUE = 2;
}

enum Month {
  MONTH_UNSPECIFIED = 0;
  JANUARY = 1;
  FEBRUARY = 2;
  MARCH = 3;
  APRIL = 4;
  MAY = 5;
  JUNE = 6;
  JULY = 7;
  AUGUST = 8;
  SEPTEMBER = 9;
  OCTOBER = 10;
  NOVEMBER = 11;
  DECEMBER = 12;
}

// more values than lines on a usual terminal: the list scrolls
enum Big {
  VALUE_00 = 0;
  VALUE_01 = 1;
  VALUE_02 = 2;
  VALUE_03 = 3;
  VALUE_04 = 4;
  VALUE_05 = 5;
  VALUE_06 = 6;
  VALUE_07 = 7;
  VALUE_08 = 8;
  VALUE_09 = 9;
  VALUE_10 = 10;
  VALUE_11 = 11;
  VALUE_12 = 12;
  VALUE_13 = 13;
  VALUE_14 = 14;
  VALUE_15 = 15;
  VALUE_16 = 16;
  VALUE_17 = 17;
  VALUE_18 = 18;
  VALUE_19 = 19;
  VALUE_20 = 20;
  VALUE_21 = 21;
  VALUE_22 = 22;
  VALUE_23 = 23;
  VALUE_24 = 24;
  VALUE_25 = 25;
  VALUE_26 = 26;
  VALUE_27 = 27;
  VALUE_28 = 28;
  VALUE_29 = 29;
  VALUE_30 = 30;
  VALUE_31 = 31;
  VALUE_32 = 32;
  VALUE_33 = 33;
  VALUE_34 = 34;
  VALUE_35 = 35;
  VALUE_36 = 36;
  VALUE_37 = 37;
  VALUE_38 = 38;
  VALUE_39 = 39;
  VALUE_40 = 40;
  VALUE_41 = 41;
