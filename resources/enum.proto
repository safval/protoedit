message Enums {
  // GREEN in the data
  Color color = 1;
  // MAY in the data; a typed letter jumps to the next value starting with it
  Month month = 2;
  // RED, BLUE, GREEN in the data
  repeated Color palette = 3;
  // absent from the data: the default value is shown, choosing a value inserts the field
  Color absent = 4;
  // 42 in the data; a too long number shows the error in the status line
  int32 number = 5;
  // 7 in the data, not a value of Color: shown as ?7
  Color unknown_value = 6;
  // VALUE_45 in the data
  Big big = 7;
}
